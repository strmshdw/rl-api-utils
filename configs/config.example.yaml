# ==============================================================================
# Rocket League Replay Synchronizer Daemon Configuration Template
# ==============================================================================

# Authentication Settings
# Supported providers: "epic" or "steam"
auth:
  provider: "epic" # Override with RL_SYNC_AUTH_PROVIDER

  # Epic Games Authentication
  # Leaving refresh_token and auth_code empty will trigger an interactive login flow
  # displaying the Epic Games login URL and prompting for an authorization code.
  # The resulting refresh_token will be automatically saved back to this config file.
  epic:
    # Long-term OAuth refresh token (auto-saved after interactive login)
    refresh_token: ""                       # Override with RL_SYNC_EPIC_REFRESH_TOKEN
    
    # One-time login exchange code (optional bootstrap code)
    auth_code: ""                           # Override with RL_SYNC_EPIC_AUTH_CODE
    
    # Optional account identifiers
    account_id: ""                          # Override with RL_SYNC_EPIC_ACCOUNT_ID
    display_name: ""                        # Override with RL_SYNC_EPIC_DISPLAY_NAME

  # Steam Authentication
  # You can either provide 'username' and 'password' for automated ticket generation,
  # or manually supply a pre-generated 'session_ticket' and 'steam_id_64'.
  # When username/password are used, a persistent 'login_key' will be automatically
  # generated and saved to this file, enabling silent background reauth without 2FA.
  steam:
    # Steam credentials for automated ticket generation & reauth
    username: ""                            # Override with RL_SYNC_STEAM_USERNAME
    password: ""                            # Override with RL_SYNC_STEAM_PASSWORD
    login_key: ""                           # Auto-saved login key for silent background reauth
    
    # Pre-generated hex session ticket (auto-populated by automated generator)
    session_ticket: ""                      # Override with RL_SYNC_STEAM_SESSION_TICKET
    
    # 64-bit Steam ID (e.g. 76561198000000000; auto-discovered by generator)
    steam_id_64: ""                         # Override with RL_SYNC_STEAM_ID_64
    
    # Optional Steam account display name
    account_name: ""                        # Override with RL_SYNC_STEAM_ACCOUNT_NAME

# Ballchasing.com Upload Settings
ballchasing:
  # User upload API key from https://ballchasing.com/upload
  api_key: "your-ballchasing-api-key"      # Override with RL_SYNC_BALLCHASING_API_KEY
  
  # Upload visibility: "public", "unlisted", or "private"
  visibility: "public"                     # Override with RL_SYNC_BALLCHASING_VISIBILITY
  
  # Base API URL (defaults to production; change for mock testing)
  base_url: "https://ballchasing.com/api"   # Override with RL_SYNC_BALLCHASING_BASE_URL
  
  # HTTP request timeout for multipart uploads
  timeout: "60s"                           # Override with RL_SYNC_BALLCHASING_TIMEOUT
  
  # Maximum retry attempts on HTTP 429 rate limit or network error
  max_retries: 3                           # Override with RL_SYNC_BALLCHASING_MAX_RETRIES

# Synchronization Engine Settings
sync:
  # Polling interval between PsyNet match history checks
  poll_interval: "5m"                      # Override with RL_SYNC_POLL_INTERVAL
  
  # Local filesystem directory where downloaded .replay files are stored
  replay_dir: "./replays"                  # Override with RL_SYNC_REPLAY_DIR
  
  # Path to SQLite persistence database (or .json for JSON state store)
  db_path: "./rl-sync.db"                  # Override with RL_SYNC_DB_PATH
  
  # Whether to retain .replay files on disk after successful upload
  keep_local_files: true                   # Override with RL_SYNC_KEEP_LOCAL_FILES
  
  # HTTP download timeout for streaming replay binary payload
  download_timeout: "30s"                  # Override with RL_SYNC_DOWNLOAD_TIMEOUT
  
  # Dry-run mode: discover and diff matches, but do not download or upload
  dry_run: false                           # Override with RL_SYNC_DRY_RUN or --dry-run
  
  # Once mode: run exactly one polling pass and then terminate
  once: false                              # Override with RL_SYNC_ONCE or --once

# ==============================================================================
# Secondary Polling Account Settings (PsyNet Rank Retrieval)
# ==============================================================================
# To avoid Error 67 duplicate login kicks on your primary account, configure a
# secondary non-playing account to fetch competitive ranks and MMR out-of-band.
# Prompts for this account are clearly labeled [Secondary Polling Account].
polling_auth:
  # Enable secondary polling authentication for rank retrieval
  enabled: false                           # Override with RL_SYNC_POLLING_AUTH_ENABLED

  # Polling auth provider: "epic" or "steam"
  provider: "epic"                         # Override with RL_SYNC_POLLING_AUTH_PROVIDER

  # Secondary Epic Games Account (must differ from primary auth)
  # Leaving refresh_token empty will trigger an interactive prompt for the polling account.
  epic:
    refresh_token: ""                      # Override with RL_SYNC_POLLING_EPIC_REFRESH_TOKEN
    auth_code: ""                          # Override with RL_SYNC_POLLING_EPIC_AUTH_CODE or RL_SYNC_POLLING_EPIC_AUTHORIZATION_CODE
    account_id: ""                         # Override with RL_SYNC_POLLING_EPIC_ACCOUNT_ID
    display_name: ""                       # Override with RL_SYNC_POLLING_EPIC_DISPLAY_NAME

  # Secondary Steam Account (must differ from primary auth)
  # Supports username and password for automated ticket generation & silent reauth.
  steam:
    username: ""                           # Override with RL_SYNC_POLLING_STEAM_USERNAME
    password: ""                           # Override with RL_SYNC_POLLING_STEAM_PASSWORD
    login_key: ""                          # Auto-saved login key for silent background reauth
    session_ticket: ""                     # Override with RL_SYNC_POLLING_STEAM_SESSION_TICKET
    steam_id_64: ""                        # Override with RL_SYNC_POLLING_STEAM_ID_64
    account_name: ""                       # Override with RL_SYNC_POLLING_STEAM_ACCOUNT_NAME

# ==============================================================================
# Player Tracking & Matchup Analytics Settings
# ==============================================================================
# Monitors teammates and opponents in matches, records win/loss records per playlist,
# and automatically fetches live competitive ranks for lobby players.
player_tracking:
  # Enable player tracking subsystem
  enabled: true                            # Override with RL_SYNC_PLAYER_TRACKING_ENABLED

  # Explicit local player identifier (e.g. "Epic|<account_id>|0" or "Steam|<steam_id_64>|0").
  # If empty, automatically resolved from primary auth account credentials.
  local_player_id: ""                      # Override with RL_SYNC_LOCAL_PLAYER_ID or RL_SYNC_PLAYER_TRACKING_LOCAL_PLAYER_ID

  # Optional local player display name override.
  local_player_name: ""                    # Override with RL_SYNC_LOCAL_PLAYER_NAME or RL_SYNC_PLAYER_TRACKING_LOCAL_PLAYER_NAME

  # Automatically trigger PsyNet rank queries for players when entering a match lobby
  auto_fetch_ranks: true                   # Override with RL_SYNC_AUTO_FETCH_RANKS or RL_SYNC_PLAYER_TRACKING_AUTO_FETCH_RANKS

# Rocket League Local Stats API (MatchStatsExporter_TA) Settings
# The game client can broadcast match events locally without using PsyNet auth tokens,
# preventing duplicate login errors and party disconnects while playing in-game.
# Enable in Rocket League by editing TAGame\Config\TAStatsAPI.ini:
#   [TAGame.MatchStatsExporter_TA]
#   Port=49123
#   WebPort=49124
#   PacketSendRate=30
stats_api:
  # Enable listening to Rocket League's local Stats API stream
  enabled: true                            # Override with RL_SYNC_STATS_API_ENABLED or --stats-api

  # Local address of Rocket League Stats API (default WebPort is 49124, TCP Port is 49123)
  address: "127.0.0.1:49124"               # Override with RL_SYNC_STATS_API_ADDRESS

  # Protocol to use: "websocket" or "tcp"
  protocol: "websocket"                    # Override with RL_SYNC_STATS_API_PROTOCOL

  # Number of un-downloaded matches in queue before triggering toast/warning
  trigger_threshold: 15                    # Override with RL_SYNC_TRIGGER_THRESHOLD or --trigger-threshold

  # Force immediate PsyNet match history query and replay sync when trigger fires
  # If false, displays toast notification and awaits manual trigger or game exit
  force_sync_on_trigger: false             # Override with RL_SYNC_FORCE_SYNC_ON_TRIGGER or --force-sync

  # Enable Windows desktop toast notification when threshold is reached
  enable_toast: true                       # Override with RL_SYNC_ENABLE_TOAST

  # Local port for manual HTTP trigger endpoint (http://127.0.0.1:49125/sync)
  # Set to 0 to disable
  http_trigger_port: 49125                 # Override with RL_SYNC_HTTP_TRIGGER_PORT

  # Automatically trigger a sync pass when Rocket League game client closes
  auto_sync_on_exit: true                  # Override with RL_SYNC_AUTO_SYNC_ON_EXIT

# Structured Logging Settings
logging:
  # Minimum log level: "debug", "info", "warn", or "error"
  level: "info"                            # Override with RL_SYNC_LOG_LEVEL or --log-level
  
  # Log format: "text" (human-friendly console) or "json" (structured production)
  format: "text"                           # Override with RL_SYNC_LOG_FORMAT or --log-format
