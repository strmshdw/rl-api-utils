enums:
  match_status:
    - const: MatchStatusPending
      ts_const: PENDING
      value: PENDING
    - const: MatchStatusDownloaded
      ts_const: DOWNLOADED
      value: DOWNLOADED
    - const: MatchStatusSynced
      ts_const: SYNCED
      value: SYNCED
    - const: MatchStatusFailed
      ts_const: FAILED
      value: FAILED

  replay_stats_status:
    - const: ReplayStatsPending
      ts_const: PENDING
      value: pending
    - const: ReplayStatsFetched
      ts_const: FETCHED
      value: fetched
    - const: ReplayStatsExpired
      ts_const: EXPIRED
      value: expired
    - const: ReplayStatsFailed
      ts_const: FAILED
      value: failed
    - const: ReplayStatsUnavailable
      ts_const: UNAVAILABLE
      value: unavailable

  player_classification:
    - const: ClassificationSelf
      ts_const: SELF
      value: self
    - const: ClassificationTeammate
      ts_const: TEAMMATE
      value: teammate
    - const: ClassificationOpponent
      ts_const: OPPONENT
      value: opponent
    - const: ClassificationBot
      ts_const: BOT
      value: bot
    - const: ClassificationSpectator
      ts_const: SPECTATOR
      value: spectator

  sync_mode:
    - const: SyncModeAuto
      ts_const: AUTO
      value: auto
    - const: SyncModeManual
      ts_const: MANUAL
      value: manual
    - const: SyncModeStartup
      ts_const: STARTUP
      value: startup

  sse_event_type:
    - const: EventMatchUpdate
      ts_const: MATCH_UPDATE
      value: match_update
    - const: EventMatchEnded
      ts_const: MATCH_ENDED
      value: match_ended
    - const: EventClockUpdated
      ts_const: CLOCK_UPDATED
      value: clock_updated
    - const: EventSessionUpdate
      ts_const: SESSION_UPDATE
      value: session_update
    - const: EventSyncProgress
      ts_const: SYNC_PROGRESS
      value: sync_progress

